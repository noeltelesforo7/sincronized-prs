# Workflow: Actualizar estado de elementos en GitHub Projects v2 cuando se fusiona un PR
#
# ¿Cómo funciona?
#   1. Se activa cuando un pull request se cierra (GitHub envía este evento tanto para
#      PRs fusionados como simplemente cerrados, así que lo protegemos con 
#      `if: github.event.pull_request.merged == true`).
#   2. Se extrae el nombre de la rama de destino del PR fusionado (`base.ref`) y se usa
#      como valor de estado deseado (ej: fusionar hacia `dev` → establece el estado del elemento en `dev`).
#   3. El workflow busca cada elemento del proyecto vinculado al PR (o a los issues
#      cerrados por el PR) y actualiza su campo "Status" (selección única).
#
# Permisos necesarios (configurados a nivel de job):
#   - `pull-requests: read`  – para leer metadatos del PR
#   - `issues: read`         – para leer issues vinculados
#
# Secretos / Variables requeridas:
#   - `PROJECT_TOKEN`  – un PAT (Personal Access Token) con alcance `project`
#     (o `read:project` + `write:project`). El GITHUB_TOKEN incorporado NO tiene
#     acceso de escritura a proyectos, así que debes crear un PAT y guardarlo
#     como secreto de repositorio/organización named PROJECT_TOKEN.
#   - `PROJECT_NUMBER` – el ID numérico que aparece en la URL del proyecto
#     (ej: https://github.com/orgs/MyOrg/projects/42 → 42).
#     Guárdalo como variable de repositorio (Settings → Secrets and variables →
#     Variables) con el nombre PROJECT_NUMBER, o hardcódalo en el bloque env.
#   - `PROJECT_OWNER`  – el login de GitHub (usuario u organización) propietario
#     del proyecto. Si no se establece, toma por defecto el propietario del repo.
#
# ════════════════════════════════════════════════════════════════════════════════

name: Actualizar estado del elemento del proyecto en fusión de PR

on:
  pull_request:
    types: [closed]

# Solo una actualización se ejecuta por vez para cada PR; las ejecuciones 
# anteriores se cancelan.
concurrency:
  group: update-project-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-status:
    # Solo ejecutar cuando el PR fue realmente fusionado (no solo cerrado sin fusión).
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      issues: read

    steps:
      # ──────────────────────────────────────────────────────────────────────────────
      # PASO 1: Extraer la rama de destino y usarla como estado destino
      # ──────────────────────────────────────────────────────────────────────────────
      - name: Derivar estado destino desde la rama de destino
        id: branch
        run: |
          # La rama de destino del PR se convierte en el valor de estado deseado.
          # Ajusta este mapeo si tu proyecto usa etiquetas de estado diferentes.
          BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "status=${BRANCH}" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────────────
      # PASO 2: Actualizar elementos del proyecto vinculados
      # ──────────────────────────────────────────────────────────────────────────────
      - name: Actualizar elementos vinculados del proyecto
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || github.token }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER != '' && vars.PROJECT_OWNER || github.repository_owner }}
          TARGET_STATUS: ${{ steps.branch.outputs.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "✓ PR #${PR_NUMBER} fusionado hacia rama '${TARGET_STATUS}'"
          echo "🔍 Buscando proyecto #${PROJECT_NUMBER} propiedad de '${PROJECT_OWNER}'"

          # ─────────────────────────────────────────────────────────────────────────
          # FASE 1: Resolver el ID del proyecto y el ID del campo Status
          # ─────────────────────────────────────────────────────────────────────────
          # Intentar obtener el proyecto del usuario; si no existe, intentar
          # obtenerlo de la organización.
          PROJECT_DATA=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              projectV2: user(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }
          ' -F owner="${PROJECT_OWNER}" -F number="${PROJECT_NUMBER}" 2>/dev/null || \
          gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              projectV2: organization(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }
          ' -F owner="${PROJECT_OWNER}" -F number="${PROJECT_NUMBER}")

          PROJECT_ID=$(echo "$PROJECT_DATA" | jq -r '.data.projectV2.projectV2.id // empty')
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::No se pudo resolver el ID del proyecto. Verifica PROJECT_NUMBER y PROJECT_OWNER."
            exit 1
          fi

          # Buscar el campo Status y la opción cuyo nombre coincida con la rama de destino.
          STATUS_FIELD_ID=$(echo "$PROJECT_DATA" | \
            jq -r '.data.projectV2.projectV2.fields.nodes[] | select(.name == "Status") | .id // empty' | head -1)
          STATUS_OPTION_ID=$(echo "$PROJECT_DATA" | \
            jq -r --arg status "$TARGET_STATUS" \
              '.data.projectV2.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == $status) | .id // empty' | head -1)

          if [ -z "$STATUS_FIELD_ID" ]; then
            echo "::warning::No se encontró campo 'Status' en el proyecto. Nada que actualizar."
            exit 0
          fi
          if [ -z "$STATUS_OPTION_ID" ]; then
            echo "::warning::No se encontró opción de estado llamada '${TARGET_STATUS}'. Nada que actualizar."
            exit 0
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "ID del Proyecto:  ${PROJECT_ID}"
          echo "ID del campo Status: ${STATUS_FIELD_ID}"
          echo "ID de la opción:  ${STATUS_OPTION_ID} (etiqueta: ${TARGET_STATUS})"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # ─────────────────────────────────────────────────────────────────────────
          # FASE 2: Recopilar IDs de elementos del proyecto vinculados a este PR
          # ─────────────────────────────────────────────────────────────────────────
          # a) Elementos vinculados directamente al PR
          # b) Elementos vinculados a issues cerrados por el PR (cierre automático)
          ITEMS=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  projectItems(first: 20) {
                    nodes { id project { id } }
                  }
                  closingIssuesReferences(first: 20) {
                    nodes {
                      projectItems(first: 20) {
                        nodes { id project { id } }
                      }
                    }
                  }
                }
              }
            }
          ' -F owner="${PROJECT_OWNER}" \
            -F repo="${REPO#*/}" \
            -F pr="${PR_NUMBER}")

          ITEM_IDS=$(echo "$ITEMS" | jq -r --arg pid "$PROJECT_ID" '
            [
              .data.repository.pullRequest.projectItems.nodes[],
              (.data.repository.pullRequest.closingIssuesReferences.nodes[].projectItems.nodes[])
            ]
            | .[]
            | select(.project.id == $pid)
            | .id
          ' | sort -u)

          if [ -z "$ITEM_IDS" ]; then
            echo "ℹ️  No hay elementos del proyecto vinculados al PR #${PR_NUMBER} en proyecto #${PROJECT_NUMBER}."
            exit 0
          fi

          # ─────────────────────────────────────────────────────────────────────────
          # FASE 3: Actualizar el campo Status de cada elemento
          # ─────────────────────────────────────────────────────────────────────────
          ITEM_COUNT=$(echo "$ITEM_IDS" | wc -l)
          echo "📋 Se encontraron ${ITEM_COUNT} elemento(s) para actualizar."
          echo ""

          while IFS= read -r ITEM_ID; do
            echo "  → Actualizando elemento ${ITEM_ID} a estado '${TARGET_STATUS}'"
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $option }
                }) {
                  projectV2Item { id }
                }
              }
            ' -F project="${PROJECT_ID}" \
              -F item="${ITEM_ID}" \
              -F field="${STATUS_FIELD_ID}" \
              -F option="${STATUS_OPTION_ID}"
          done <<< "$ITEM_IDS"

          echo ""
          echo "✅ Actualización completada exitosamente."
